services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ijiedong}
      POSTGRES_USER: ${POSTGRES_USER:-ijiedong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ijiedong} -d ${POSTGRES_DB:-ijiedong}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ijiedong}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ijiedong}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/admin/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata:
