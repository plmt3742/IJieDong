services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ijiedong}
      POSTGRES_USER: ${POSTGRES_USER:-ijiedong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ijiedong_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ijiedong} -d ${POSTGRES_DB:-ijiedong}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
