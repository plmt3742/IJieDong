name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check relative links
        run: python scripts/check-links.py
      - name: Check markdown emoji
        run: python scripts/check-no-emoji.py

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r services/api/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run tests
        working-directory: services/api
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build chart-spec
        run: pnpm --filter @ijiedong/chart-spec build
      - name: Build admin
        run: pnpm --filter @ijd/admin build

  mp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mp/package-lock.json
      - name: Install dependencies
        run: npm --prefix apps/mp ci
      - name: Typecheck
        run: npm --prefix apps/mp run typecheck
