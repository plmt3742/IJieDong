[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ijiedong-api"
version = "0.1.0"
description = "i揭东 API service (Demo v0)"
requires-python = ">=3.13"
# FastAPI 0.115.x does not work with the Starlette 1.x line; this scaffold is
# validated against FastAPI 0.162.x + Starlette 1.9.x.
dependencies = [
    "fastapi>=0.162.0,<0.163.0",
    "starlette>=1.9.0,<2.0.0",
    "uvicorn>=0.54.0,<0.55.0",
    "pydantic>=2.14.1,<3.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "SQLAlchemy>=2.0.51,<2.1.0",
    "alembic>=1.18.4,<2.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "httpx>=0.28.1,<0.29.0",
    "PyJWT>=2.0.0,<3.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "xlrd>=2.0.0,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "playwright>=1.49.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
